{% extends "base.html" %}

{% block title %}Create KB Article - {{ app_name }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-4">
    
    <div class="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-800">
        <a href="/kb" class="inline-flex items-center gap-1 text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-indigo-600 transition">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            <span>Back to Knowledge Base</span>
        </a>
    </div>

    <div class="rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-xs space-y-4">
        <div class="pb-3 border-b border-slate-200 dark:border-slate-800">
            <h1 class="text-sm font-bold uppercase tracking-wider text-slate-900 dark:text-white flex items-center gap-1.5">
                <i data-lucide="plus-circle" class="w-4 h-4 text-indigo-600"></i>
                <span>Create Knowledge Base SOP Article</span>
            </h1>
        </div>

        <form method="POST" action="/kb/new" class="space-y-4">
            
            <div class="space-y-1">
                <label for="title" class="block text-xs font-semibold text-slate-700 dark:text-slate-300">
                    Title <span class="text-rose-500">*</span>
                </label>
                <input 
                    type="text" 
                    id="title" 
                    name="title" 
                    required 
                    placeholder="e.g. Resolving Corporate VPN Connection Errors"
                    class="w-full px-3 py-1.5 rounded border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-xs text-slate-900 dark:text-white focus:ring-1 focus:ring-indigo-500"
                >
            </div>

            <div class="space-y-1">
                <label for="category" class="block text-xs font-semibold text-slate-700 dark:text-slate-300">
                    Category <span class="text-rose-500">*</span>
                </label>
                <input 
                    type="text" 
                    id="category" 
                    name="category" 
                    list="category-options" 
                    required 
                    placeholder="e.g. Network & VPN"
                    class="w-full px-3 py-1.5 rounded border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-xs text-slate-900 dark:text-white focus:ring-1 focus:ring-indigo-500"
                >
                <datalist id="category-options">
                    {% for cat in categories %}
                        <option value="{{ cat }}"></option>
                    {% endfor %}
                    <option value="Network & VPN"></option>
                    <option value="Access Management"></option>
                    <option value="Laptop / Endpoint"></option>
                    <option value="Email & Collaboration"></option>
                    <option value="Printers & Devices"></option>
                    <option value="Security"></option>
                    <option value="ERP / WMS"></option>
                    <option value="Telephony"></option>
                </datalist>
            </div>

            <div class="space-y-1">
                <label for="problem" class="block text-xs font-semibold text-slate-700 dark:text-slate-300">
                    Problem Description <span class="text-rose-500">*</span>
                </label>
                <textarea 
                    id="problem" 
                    name="problem" 
                    rows="3" 
                    required 
                    placeholder="Describe the problem or error symptoms..."
                    class="w-full px-3 py-1.5 rounded border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-xs text-slate-900 dark:text-white focus:ring-1 focus:ring-indigo-500"
                ></textarea>
            </div>

            <div class="space-y-1">
                <label for="solution" class="block text-xs font-semibold text-slate-700 dark:text-slate-300">
                    Step-by-Step Fix / Solution SOP <span class="text-rose-500">*</span>
                </label>
                <textarea 
                    id="solution" 
                    name="solution" 
                    rows="5" 
                    required 
                    placeholder="Detail exact troubleshooting steps..."
                    class="w-full px-3 py-1.5 rounded border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-xs text-slate-900 dark:text-white focus:ring-1 focus:ring-indigo-500"
                ></textarea>
            </div>

            <div class="space-y-1">
                <label for="keywords" class="block text-xs font-semibold text-slate-700 dark:text-slate-300">
                    Keywords (Comma-Separated)
                </label>
                <input 
                    type="text" 
                    id="keywords" 
                    name="keywords" 
                    placeholder="vpn, timeout, network, cisco"
                    class="w-full px-3 py-1.5 rounded border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-xs text-slate-900 dark:text-white focus:ring-1 focus:ring-indigo-500"
                >
            </div>

            <div class="pt-2 flex items-center justify-end gap-2 border-t border-slate-200 dark:border-slate-800">
                <a href="/kb" class="px-3 py-1.5 rounded border border-slate-200 dark:border-slate-700 text-xs text-slate-700 dark:text-slate-300 hover:bg-slate-50 transition">
                    Cancel
                </a>
                <button type="submit" class="px-4 py-1.5 rounded bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium transition">
                    Save Article
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
