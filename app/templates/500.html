{% extends "base.html" %}

{% block title %}500 Internal Error - {{ app_name }}{% endblock %}

{% block content %}
<div class="py-12 flex flex-col items-center justify-center text-center space-y-3">
    <div class="h-12 w-12 rounded bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-rose-600 dark:text-rose-400 flex items-center justify-center">
        <i data-lucide="alert-triangle" class="w-6 h-6"></i>
    </div>
    <h1 class="text-lg font-bold text-slate-900 dark:text-white">500 - Internal Server Error</h1>
    <p class="text-xs text-slate-500 max-w-sm">An unexpected system error occurred. Please try again or contact IT support.</p>
    <a href="/tickets" class="px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium shadow-xs transition">
        Return to Queue
    </a>
</div>
{% endblock %}
