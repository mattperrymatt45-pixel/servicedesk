{% extends "base.html" %}

{% block title %}404 Not Found - {{ app_name }}{% endblock %}

{% block content %}
<div class="py-12 flex flex-col items-center justify-center text-center space-y-3">
    <div class="h-12 w-12 rounded bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 text-amber-600 dark:text-amber-400 flex items-center justify-center">
        <i data-lucide="alert-circle" class="w-6 h-6"></i>
    </div>
    <h1 class="text-lg font-bold text-slate-900 dark:text-white">404 - Page Not Found</h1>
    <p class="text-xs text-slate-500 max-w-sm">The requested ticket, KB article, or resource could not be found.</p>
    <a href="/tickets" class="px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium shadow-xs transition">
        Return to Queue
    </a>
</div>
{% endblock %}
