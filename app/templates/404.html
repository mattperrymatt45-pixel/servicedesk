{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="min-h-[50vh] flex flex-col items-center justify-center text-center space-y-4">
    <div class="h-20 w-20 rounded-full bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 flex items-center justify-center text-4xl shadow-inner">
        🔍
    </div>
    <h1 class="text-4xl font-extrabold text-slate-900 dark:text-white">404 - Page Not Found</h1>
    <p class="text-slate-600 dark:text-slate-400 max-w-md">
        The requested resource or page could not be located.
    </p>
    <a href="/" class="inline-flex items-center gap-2 rounded-xl bg-brand-600 text-white px-5 py-2.5 font-medium shadow hover:bg-brand-700 transition">
        <span>🏠 Return Home</span>
    </a>
</div>
{% endblock %}
